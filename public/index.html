<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dubai Flat Scanner</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css" />
<style>
  :root {
    --bg: #f7f5f2; --card: #ffffff; --text: #1a1a1a; --muted: #6b6b6b;
    --accent: #0f6f5c; --border: #e6e2db; --badge: #eaf5f1;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#15181a; --card:#1f2326; --text:#f1efe9; --muted:#9aa1a6; --accent:#4fd1b5; --border:#2c3134; --badge:#1c2b28; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  header { padding: 28px 24px 16px; max-width: 1100px; margin: 0 auto; }
  h1 { margin: 0 0 4px; font-size: 1.5rem; }
  .meta { color: var(--muted); font-size: 0.9rem; }
  .criteria { color: var(--muted); font-size: 0.85rem; margin-top: 8px; }
  main { max-width: 1100px; margin: 0 auto; padding: 8px 24px 48px; }
  .view-toggle { display: flex; gap: 8px; margin-bottom: 16px; }
  .view-toggle button {
    font: inherit; font-weight: 600; font-size: 0.85rem; padding: 7px 16px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--card); color: var(--text); cursor: pointer;
  }
  .view-toggle button[aria-pressed="true"] { background: var(--accent); color: var(--card); border-color: var(--accent); }
  .view-toggle button.scan { margin-left: auto; background: var(--accent); color: var(--card); border-color: var(--accent); }
  .view-toggle button.scan.fb { margin-left: 0; background: #1877f2; border-color: #1877f2; }
  .view-toggle button.scan[disabled] { opacity: 0.6; cursor: progress; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; text-decoration: none; color: inherit; }
  .card:hover { border-color: var(--accent); }
  .card img { width: 100%; height: 160px; object-fit: cover; background: var(--border); }
  .card-body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .price { font-size: 1.15rem; font-weight: 700; color: var(--accent); }
  .title { font-weight: 600; font-size: 0.95rem; line-height: 1.3; }
  .area { color: var(--muted); font-size: 0.85rem; }
  .sublet { font-size: 0.78rem; color: var(--muted); background: var(--bg); border: 1px dashed var(--border); border-radius: 8px; padding: 6px 8px; margin-top: 2px; }
  .sublet b { color: var(--text); }
  .sublet .fx { opacity: 0.7; font-size: 0.9em; }
  .row { display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 8px; }
  .badges { display:flex; gap:6px; flex-wrap: wrap; }
  .badge { font-size: 0.72rem; background: var(--badge); color: var(--accent); padding: 2px 8px; border-radius: 999px; font-weight: 600; }
  .source { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  #map { height: 70vh; min-height: 420px; width: 100%; border-radius: 12px; border: 1px solid var(--border); }
  .map-note { color: var(--muted); font-size: 0.8rem; margin-top: 8px; }
  .leaflet-popup-content b { color: var(--accent); }
  .status { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 4px; }
  .chip { font-size: 0.8rem; padding: 6px 12px; border-radius: 10px; border: 1px solid var(--border); line-height: 1.35; }
  .chip.ok { background: var(--badge); color: var(--accent); border-color: var(--accent); }
  .chip.warn { background: #fdf0e4; color: #9a5a2a; border-color: #e8b98f; }
  @media (prefers-color-scheme: dark) { .chip.warn { background: #2c2114; color: #e6b58a; border-color: #6b4f2f; } }
  .chip b { font-weight: 700; }
  .source-filter { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; align-items: center; }
  .src-btn { font: inherit; font-size: 0.82rem; font-weight: 600; padding: 6px 12px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--card); color: var(--text); cursor: pointer; display: inline-flex; align-items: center; gap: 7px; }
  .src-btn[aria-pressed="false"] { opacity: 0.45; }
  .src-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .src-btn .count { color: var(--muted); font-weight: 500; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>Dubai Flat Scanner</h1>
  <div class="meta" id="meta">Loading…</div>
  <div class="criteria" id="criteria"></div>
  <div class="status" id="status"></div>
  <div class="criteria">Each card shows an estimated winter room-sublet rate for its area and what you'd net-pay after renting the second room out, in EUR (AED alongside) &mdash; ballpark figures from market research, not live data.</div>
</header>
<main>
  <div class="view-toggle" role="tablist">
    <button id="btn-list" type="button" aria-pressed="true">List</button>
    <button id="btn-map" type="button" aria-pressed="false">Map</button>
    <button id="btn-scan" type="button" class="scan" hidden>↻ Scan now</button>
    <button id="btn-fb" type="button" class="scan fb" hidden title="Runs the paid Apify scrapers (Facebook, plus Bayut/Dubizzle if you've enabled their actors) — uses Apify credit">＋ Include Facebook &amp; paid sources (Apify credit)</button>
  </div>

  <div class="source-filter" id="source-filter"></div>

  <div class="grid" id="list-view"></div>
  <div class="empty" id="empty" hidden></div>

  <div id="map-view" hidden>
    <div id="map"></div>
    <div class="map-note" id="map-note"></div>
  </div>
</main>

<script src="/vendor/leaflet/leaflet.js"></script>
<script>
  const DUBAI_CENTER = [25.2048, 55.2708];
  const NAMES = { propertyfinder: "Property Finder", facebook: "Facebook", bayut: "Bayut", dubizzle: "Dubizzle" };
  // One colour per source — used for the map markers, the legend, and the card source dot.
  const SOURCE_COLORS = { propertyfinder: "#0f6f5c", facebook: "#1877f2", dubizzle: "#e4002b", bayut: "#16a34a" };
  const colorFor = (src) => SOURCE_COLORS[src] || "#888";

  let LISTINGS = [];
  let map = null, markersLayer = null;
  let activeSources = new Set();  // which sources are currently shown (all, by default)

  const el = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const fmt = (v) => v == null ? "?" : Math.round(v).toLocaleString();

  const visibleListings = () => LISTINGS.filter(l => activeSources.has(l.source));

  function cardHtml(l) {
    const roomEur = `~&euro;${fmt(l.est_room_rent_typical_eur)}&ndash;${fmt(l.est_room_rent_max_eur)}/mo`;
    const roomAed = `(AED ${fmt(l.est_room_rent_typical_aed)}&ndash;${fmt(l.est_room_rent_max_aed)})`;
    const netEur = `~&euro;${fmt(l.net_cost_best_case_eur)}&ndash;${fmt(l.net_cost_typical_eur)}/mo net`;
    const netAed = `(AED ${fmt(l.net_cost_best_case_aed)}&ndash;${fmt(l.net_cost_typical_aed)})`;
    return `
      <a class="card" href="${esc(l.url)}" target="_blank" rel="noopener">
        ${l.image_url ? `<img src="${esc(l.image_url)}" alt="" loading="lazy" onerror="this.style.display='none'">` : ""}
        <div class="card-body">
          <div class="price">${fmt(l.price_monthly_aed)} AED/mo</div>
          <div class="title">${esc(l.title)}</div>
          <div class="area">${esc(l.area)}</div>
          <div class="area">${(l.bedrooms != null || l.bathrooms != null)
            ? `${l.bedrooms != null ? l.bedrooms + " bed" : "? bed"} · ${l.bathrooms != null ? l.bathrooms + " bath" : "? bath"}`
            : "beds/baths not listed"}</div>
          <div class="sublet">Sublet a room (winter): ${roomEur} <span class="fx">${roomAed}</span> &rarr; <b>you'd pay ${netEur}</b> <span class="fx">${netAed}</span></div>
          <div class="row">
            <div class="badges">${l.preferred ? '<span class="badge">Preferred area</span>' : ""}</div>
            <div class="source"><span class="src-dot" style="background:${colorFor(l.source)}"></span> ${esc(NAMES[l.source] || l.source)}</div>
          </div>
        </div>
      </a>`;
  }

  function renderList() {
    const vis = visibleListings();
    el("list-view").innerHTML = vis.map(cardHtml).join("\n");
    el("empty").hidden = vis.length > 0;
    if (!vis.length) el("empty").textContent = LISTINGS.length
      ? "No listings from the selected source(s) — try enabling more above."
      : "No matching listings right now — check back later.";
  }

  // Toggle chips, one per source present in the data, to filter list + map.
  function renderSourceFilter() {
    const box = el("source-filter");
    const present = [...new Set(LISTINGS.map(l => l.source))];
    if (present.length < 2) { box.innerHTML = ""; return; }  // nothing to filter with one source
    const counts = {};
    LISTINGS.forEach(l => { counts[l.source] = (counts[l.source] || 0) + 1; });
    box.innerHTML = '<span class="criteria" style="margin:0 4px 0 0">Show:</span>' + present.map(src =>
      `<button type="button" class="src-btn" data-src="${src}" aria-pressed="${activeSources.has(src)}">
         <span class="src-dot" style="background:${colorFor(src)}"></span>${esc(NAMES[src] || src)} <span class="count">${counts[src]}</span>
       </button>`
    ).join("");
    box.querySelectorAll(".src-btn").forEach(btn => btn.addEventListener("click", () => {
      const src = btn.dataset.src;
      if (activeSources.has(src)) {
        if (activeSources.size > 1) activeSources.delete(src);  // keep at least one on
      } else {
        activeSources.add(src);
      }
      btn.setAttribute("aria-pressed", activeSources.has(src));
      renderList();
      if (!el("map-view").hidden) refreshMap();
    }));
  }

  function showList() {
    el("list-view").hidden = false;
    el("empty").hidden = visibleListings().length > 0;
    el("map-view").hidden = true;
    el("btn-list").setAttribute("aria-pressed", "true");
    el("btn-map").setAttribute("aria-pressed", "false");
  }

  function refreshMap() {
    if (!map) {
      map = L.map("map").setView(DUBAI_CENTER, 11);

      // Realistic satellite imagery with ENGLISH labels (Esri). Default OpenStreetMap
      // tiles label everything in the local language (Arabic in Dubai) — Esri's
      // reference layer is in English, so streets/areas read in English.
      const esriAttr = "Tiles &copy; Esri";
      const imagery = L.tileLayer(
        "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
        { attribution: esriAttr, maxZoom: 19 });
      const labels = L.tileLayer(
        "https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}",
        { maxZoom: 19 });
      const roads = L.tileLayer(
        "https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}",
        { maxZoom: 19 });
      const satellite = L.layerGroup([imagery, roads, labels]);  // realistic + English labels
      const streets = L.tileLayer(
        "https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",
        { attribution: esriAttr, maxZoom: 19 });  // plain street map, also English

      satellite.addTo(map);                       // default view: realistic satellite
      L.control.layers({ "Satellite": satellite, "Street map": streets }, null, { collapsed: false }).addTo(map);
      markersLayer = L.layerGroup().addTo(map);
    }
    markersLayer.clearLayers();

    const points = visibleListings().filter(l => l.latitude != null && l.longitude != null);
    const bounds = [];
    points.forEach(p => {
      const priceText = p.price_monthly_aed != null ? Math.round(p.price_monthly_aed).toLocaleString() + " AED/mo" : "Price N/A";
      L.circleMarker([p.latitude, p.longitude], {
        radius: 8, color: "#fff", weight: 1.5, fillColor: colorFor(p.source), fillOpacity: 0.9,
      }).addTo(markersLayer).bindPopup(
        "<b>" + priceText + "</b><br>" + esc(p.title) + "<br>" +
        '<span style="color:#6b6b6b">' + esc(p.area) + " &middot; " + esc(NAMES[p.source] || p.source) + "</span><br>" +
        '<a href="' + esc(p.url) + '" target="_blank" rel="noopener">View listing &rarr;</a>'
      );
      bounds.push([p.latitude, p.longitude]);
    });
    if (bounds.length) map.fitBounds(bounds, { padding: [30, 30], maxZoom: 14 });

    // Legend: which colour is which source (only those currently shown with points).
    const shown = [...new Set(points.map(p => p.source))];
    const legend = shown.map(s =>
      `<span style="display:inline-flex;align-items:center;gap:5px;margin-right:12px"><span class="src-dot" style="background:${colorFor(s)}"></span>${esc(NAMES[s] || s)}</span>`
    ).join("");
    el("map-note").innerHTML = points.length
      ? legend + "<br>" + points.length + " of " + visibleListings().length + " shown listings have map coordinates (not every source provides them)."
      : "None of the selected listings have map coordinates yet.";
    // Leaflet needs its container's real size; when the map is first shown (its wrapper
    // was display:none), recompute a few times so tiles lay out correctly instead of
    // rendering grey/half-drawn.
    [0, 150, 400].forEach(t => setTimeout(() => map && map.invalidateSize(), t));
  }

  function showMap() {
    el("list-view").hidden = true;
    el("empty").hidden = true;
    el("map-view").hidden = false;
    el("btn-list").setAttribute("aria-pressed", "false");
    el("btn-map").setAttribute("aria-pressed", "true");
    refreshMap();
  }

  el("btn-list").addEventListener("click", showList);
  el("btn-map").addEventListener("click", showMap);

  // Turn a raw per-source error into plain-English guidance, so the page itself says
  // exactly why a source isn't showing — no need to read logs or a terminal.
  function friendlyError(name, s) {
    const e = (s.error || "").toLowerCase();
    if (e.includes("apify_api_token")) return `not running — the APIFY_API_TOKEN environment variable is missing in Vercel. Add it under Project → Settings → Environment Variables, then redeploy.`;
    if (e.includes("timed out")) return `the Apify run was slower than the scan window and got cut off. Press “Scan now” again, or this needs async mode.`;
    if (e.includes("401") || e.includes("403") || e.includes("token") || e.includes("unauthor")) return `Apify rejected the token (invalid, or out of monthly credit). Check it in Vercel.`;
    if (e.includes("404")) return `the Apify actor id is wrong or not accessible on your account.`;
    return s.error;
  }

  function renderStatus(sources) {
    const box = document.getElementById("status");
    if (!sources || !Object.keys(sources).length) { box.innerHTML = ""; return; }
    box.innerHTML = Object.entries(sources).map(([name, s]) => {
      const label = NAMES[name] || name;
      if (s.error) {
        return `<div class="chip warn"><b>${label}:</b> ${esc(friendlyError(name, s))}</div>`;
      }
      if ((s.fetched || 0) > 0 && (s.matched || 0) === 0) {
        return `<div class="chip warn"><b>${label}:</b> found ${s.fetched}, but none matched your 2-bed / 2-bath ≤ 6,000 filter.</div>`;
      }
      return `<div class="chip ok"><b>${label}:</b> ${s.matched} matching</div>`;
    }).join("");
  }

  function render(data) {
    LISTINGS = data.listings || [];
    const when = data.generated_at ? new Date(data.generated_at).toLocaleString() : "never";
    el("meta").textContent = `Last updated ${when} · ${LISTINGS.length} matching listings`;
    if (data.criteria) {
      const c = data.criteria;
      el("criteria").innerHTML = `Budget &le; ${c.max_price_monthly_aed.toLocaleString()} AED/month &middot; ${c.bedrooms} bed / ${c.bathrooms} bath &middot; excluding Marina &amp; JLT &middot; Jumeirah &amp; water-adjacent areas preferred &middot; listed within the last 30 days`;
    }
    renderStatus(data.sources);
    if (data.error) el("meta").textContent += ` · (data error: ${data.error})`;

    // New data → show all sources by default, rebuild the filter, list, and (if open) map.
    activeSources = new Set(LISTINGS.map(l => l.source));
    renderSourceFilter();
    renderList();
    if (!el("map-view").hidden) refreshMap();
  }

  // Bayut & Dubizzle are scraped for free by GitHub Actions (real browser) and committed
  // to /browser_sources.json. We fetch that static file and merge it into every view, so
  // those two sources appear at no cost. Missing/empty file → just skipped.
  function fetchBrowserSources() {
    return fetch("/browser_sources.json", { cache: "no-store" })
      .then(r => (r.ok ? r.json() : null))
      .catch(() => null);
  }

  function mergeBrowserSources(data, bs) {
    if (!bs || !Array.isArray(bs.listings) || !bs.listings.length) {
      if (bs && bs.sources) data.sources = Object.assign({}, data.sources, bs.sources);
      return data;
    }
    const seen = new Set((data.listings || []).map(l => l.id));
    data.listings = (data.listings || []).concat(bs.listings.filter(l => !seen.has(l.id)));
    data.listings.sort((a, b) =>
      ((a.preferred ? 0 : 1) - (b.preferred ? 0 : 1)) ||
      ((a.price_monthly_aed == null ? 1e9 : a.price_monthly_aed) - (b.price_monthly_aed == null ? 1e9 : b.price_monthly_aed))
    );
    data.count = data.listings.length;
    data.sources = Object.assign({}, data.sources, bs.sources);
    return data;
  }

  // fresh: bypass the edge cache and run a live scan. apify: also run the PAID Apify
  // sources (Facebook). Normal loads/scans pass apify=false, so they never cost credit.
  function load(fresh, apify) {
    const scanBtn = el("btn-scan"), fbBtn = el("btn-fb");
    scanBtn.disabled = true; fbBtn.disabled = true;
    const active = apify ? fbBtn : scanBtn;
    const label = active.textContent;
    active.textContent = "Scanning…";
    el("meta").textContent = apify
      ? "Scanning incl. Facebook via Apify… (this can take ~20s)"
      : (fresh ? "Scanning… (a few seconds)" : "Loading…");
    let url = fresh ? "/api/data?fresh=" + Date.now() : "/api/data";
    if (apify) url += (url.includes("?") ? "&" : "?") + "apify=1";
    return fetch(url)
      .then(r => r.text().then(text => ({ status: r.status, text })))
      .then(({ status, text }) => {
        // The endpoint should return JSON. If it returns a plain-text error page
        // instead (e.g. a Vercel function crash), surface that text rather than a
        // cryptic "Unexpected token" JSON parse error.
        try {
          return JSON.parse(text);
        } catch (_) {
          throw new Error("server returned HTTP " + status + ": " + text.slice(0, 200).trim());
        }
      })
      .then(data => fetchBrowserSources().then(bs => mergeBrowserSources(data, bs)))
      .then(render)
      .catch(e => { el("meta").textContent = "Could not load listings — " + e.message; })
      .finally(() => { scanBtn.disabled = false; fbBtn.disabled = false; active.textContent = label; });
  }

  el("btn-scan").addEventListener("click", () => load(true, false));
  el("btn-fb").addEventListener("click", () => load(true, true));

  // Local `python -m scanner.main` preview injects window.__DATA__ (file:// can't
  // fetch). There the buttons can't hit /api/data, so leave them hidden.
  if (window.__DATA__) {
    render(window.__DATA__);
  } else {
    el("btn-scan").hidden = false;
    el("btn-fb").hidden = false;
    load(false, false);   // show the last cached (Apify-free) scan on open — no credit used
  }
</script>
</body>
</html>
