name: Scan listings and publish dashboard

on:
  schedule:
    - cron: "17 */3 * * *" # every 3 hours
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Bayut and Dubizzle both need a real browser (they sit behind bot-management
      # JS challenges) — installed unconditionally, not just for Facebook.
      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium

      # Facebook Marketplace, recommended path: Apify (see scanner/sources/facebook_apify.py)
      # — no login/browser of yours involved, just an API token as a repo secret.
      - name: Restore Facebook login session (legacy fallback only)
        if: ${{ secrets.FB_STORAGE_STATE != '' }}
        run: echo '${{ secrets.FB_STORAGE_STATE }}' > fb_state.json

      - name: Run scanner
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
        run: |
          if [ -n "$APIFY_API_TOKEN" ] || [ -f fb_state.json ]; then
            python -m scanner.main --with-facebook
          else
            python -m scanner.main
          fi

      # Commit the generated dashboard back into the repo. This is what actually
      # keeps the live site fresh — Vercel's GitHub integration auto-redeploys on
      # every push, since it deploys straight from committed files (see vercel.json).
      #
      # NOTE: this project previously also tried to deploy docs/ to GitHub Pages via
      # a second `deploy` job with `environment: github-pages`. That environment was
      # never actually provisioned (Settings → Pages → Source was never set to
      # "GitHub Actions"), and referencing a nonexistent deployment environment made
      # GitHub reject the ENTIRE workflow run before scheduling any job at all — every
      # run from #1 through #6 failed with zero jobs executed as a result. Since
      # Pages was only ever a secondary option and Vercel is the actual deploy target,
      # the fix is removing that job rather than going and enabling Pages for a
      # dashboard nothing points at.
      - name: Commit dashboard to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "Update dashboard [skip ci]"
          git push
